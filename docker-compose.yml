# 啟動：docker compose up -d --build
# 只開 app（例如前面已有 nginx 或雲端負載平衡器）：docker compose up -d --build app
services:
  app:
    build: .
    env_file: .env
    environment:
      TRUST_PROXY: "1"
    volumes:
      - appdata:/data
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"   # 只開給本機，外部流量走 Caddy

  caddy:
    image: caddy:2
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  appdata:
  caddy_data:
  caddy_config:
